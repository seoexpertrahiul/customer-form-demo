
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্রাহকের তথ্য ফর্ম</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f0f4f9;
      color: #222;
    }

    .form-container {
      max-width: 430px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #174ea6;
      font-size: 25px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #174ea6;
      box-shadow: 0 0 0 2px #174ea622;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #103b82;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #174ea6;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="form-container">
    <h1>গ্রাহকের তথ্য</h1>
    <p class="subtitle">অনুগ্রহ করে নিচের তথ্যগুলো পূরণ করুন</p>

    <form id="customerForm">
      <label for="name">আপনার নাম</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="আপনার পূর্ণ নাম লিখুন"
        required
      >

      <label for="phone">মোবাইল নম্বর</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="যেমন: 01XXXXXXXXX"
        pattern="01[0-9]{9}"
        title="১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর লিখুন"
        required
      >

      <label for="address">আপনার ঠিকানা</label>
      <textarea
        id="address"
        name="address"
        placeholder="গ্রাম/এলাকা, থানা ও জেলা লিখুন"
        required
      ></textarea>

      <button type="submit">তথ্য জমা দিন</button>
    </form>

    <p id="message" role="status"></p>

    <p class="note">
      এটি একটি ডেমো ফর্ম। তথ্য কোথাও সংরক্ষণ করা হয় না।
    </p>
  </div>

  <script>
    const form = document.getElementById("customerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.textContent =
        "ডেমো সফল! ফর্মটি কাজ করছে, তবে তথ্য সংরক্ষণ হয়নি।";

      form.reset();
    });
  </script>
</body>
</html>
