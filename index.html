
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কাস্টমার তথ্য ফর্ম</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #f0f4fa;
      color: #172033;
    }

    .card {
      max-width: 440px;
      margin: 30px auto;
      padding: 26px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 25px #152c5015;
    }

    h1 {
      text-align: center;
      color: #1746a2;
      font-size: 25px;
    }

    p {
      line-height: 1.6;
      color: #526078;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1746a2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .notice {
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>কাস্টমার তথ্য ফর্ম</h1>
    <p>অনুগ্রহ করে নিচের তথ্যগুলো পূরণ করে Submit করুন।</p>

    <form
      action="এখানে_আপনার_WEB_APP_URL_দিন"
      method="post">

      <label for="name">আপনার নাম</label>
      <input
        id="name"
        name="name"
        type="text"
        maxlength="100"
        autocomplete="name"
        required>

      <label for="phone">ফোন নম্বর</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        maxlength="30"
        autocomplete="tel"
        required>

      <label for="address">আপনার ঠিকানা</label>
      <textarea
        id="address"
        name="address"
        maxlength="500"
        autocomplete="street-address"
        required></textarea>

      <p class="notice">
        আপনার দেওয়া তথ্য কাস্টমার যোগাযোগের প্রয়োজনে
        সংরক্ষণ করা হবে।
      </p>

      <button type="submit">তথ্য জমা দিন</button>
    </form>
  </main>
</body>
</html>
